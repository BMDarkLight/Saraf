[project]
name = "saraf"
version = "0.1.0"
description = "Saraf: an agentic AI trading assistant for Iranian markets (crypto, currency and stock venues)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saraf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
