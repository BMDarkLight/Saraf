# Read-only health check of the deployed engine, run on the VPS's self-hosted runner (the VPS reaches the Wallex API;
# most other networks can't reach the VPS). Prints the engine's journal, state and market facts into the job log and,
# optionally, runs a backtest in the runner's own checkout (never in /opt/wallex-agent/data). Changes nothing.
name: Status

on:
  workflow_dispatch:
    inputs:
      events:
        description: newest journal events to print per run
        default: "60"
      backtest:
        description: optional backtest args, e.g. "--days 7 --decider rules", or "personas --days 7" for every persona (empty = no backtest)
        default: ""
      profile:
        description: env file loaded before the backtest (e.g. deploy/strategy.env); empty = defaults
        default: "deploy/strategy.env"

concurrency:
  group: status-vps
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, wallex-vps]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # keeps the backtest's candle cache (data/ is git-ignored) between runs
      - name: Services
        run: |
          systemctl is-active wallex-engine wallex-web wallex-strategy || true
          free -m; nproc; uptime
          systemctl list-units --no-pager --plain 'wallex-*' | head -20 || true
          for u in $(systemctl list-units --no-pager --plain --no-legend --state=failed,activating 'wallex-*' | awk '{print $1}'); do
            echo "== $u"; journalctl -u "$u" --no-pager -n 15 || true
          done
          journalctl -u wallex-engine --no-pager -n 40 --since "-6h" | grep -v '"event": "mark"' | tail -40 || true
      - name: Web endpoints
        run: |
          for u in /api/strategy/tuning /api/personas /api/strategy; do
            printf '%s ' "$u"; curl -s -o /tmp/status-body.json -w '%{http_code} %{time_total}s\n' "http://127.0.0.1:8000$u" || true
            python3 - <<'PY' || true
          import json
          d = json.load(open("/tmp/status-body.json"))
          if "personas" in d:
              for p in d["personas"]:
                  print("  ", p["id"], "active" if p["active"] else "inactive", "ret", p["return_pct"], "trades", p["trades"], "core", p["core"])
              print("   copying:", d.get("copying"))
          elif "overrides" in d:
              print("   overrides:", d["overrides"], "live:", d["live"], "copying:", d["copying"])
          else:
              print("   return_pct:", d.get("return_pct"), "allocation:", d.get("allocation"), "curve points:", len(d.get("curve") or []))
          PY
          done
      - name: Engine report
        working-directory: /opt/wallex-agent/backend
        env:
          EVENTS: ${{ inputs.events }}
        run: |
          set -a; [ -f ../deploy/challenge.env ] && . ../deploy/challenge.env; set +a
          /root/.local/bin/uv run --no-dev python "$GITHUB_WORKSPACE/backend/scripts/status.py" --events "$EVENTS"
      - name: Backtest
        if: ${{ inputs.backtest != '' }}
        working-directory: backend
        env:
          ARGS: ${{ inputs.backtest }}
          PROFILE: ${{ inputs.profile }}
        run: |
          /root/.local/bin/uv sync --frozen
          set -a; [ -n "$PROFILE" ] && . "../$PROFILE"; set +a
          # no .env in the checkout: public market data only, rules decider unless asked otherwise
          if [ "${ARGS%% *}" = "profiles" ]; then
            # "profiles a.env,b.env -- --days 14": the same rules backtest under several env files; a line each
            FILES="$(echo "$ARGS" | sed -E 's/^profiles ([^ ]+).*/\1/')"; REST="${ARGS#*--}"
            for f in ${FILES//,/ }; do
              ( set -a; . "../$f"; set +a; rm -rf ../data/backtests
                /root/.local/bin/uv run python -m wallex_agent.engine backtest $REST --decider rules > /dev/null
                m=$(ls -d ../data/backtests/*/ | head -1)
                python3 -c "import json,sys; m=json.load(open(sys.argv[1]+'metrics.json')); print('PROFILE_BT', sys.argv[2], json.dumps({k: m.get(k) for k in ('net_return_pct','max_drawdown_pct','trades','win_rate_pct','profit_factor','fees_paid_tmn','decisions','risk_blocks','by_setup','exit_reasons')}))" "$m" "$f" )
            done
          elif [ "${ARGS%% *}" = "personas" ]; then
            # "personas --days 7": one rules backtest per persona; a JSON line each for results/personas/<id>.json
            REST="${ARGS#personas}"
            for id in $(/root/.local/bin/uv run python -c "from wallex_agent.personas import PERSONAS; print(' '.join(p['id'] for p in PERSONAS))"); do
              rm -rf ../data/backtests
              /root/.local/bin/uv run python -m wallex_agent.engine backtest $REST --decider rules --persona "$id" > /dev/null
              m=$(ls -d ../data/backtests/*/ | head -1)
              python3 -c "import json,sys; m=json.load(open(sys.argv[1]+'metrics.json')); print('PERSONA_BT', json.dumps({'id': sys.argv[2], 'days': float(sys.argv[3]), **{k: m.get(k) for k in ('net_return_pct','max_drawdown_pct','trades','win_rate_pct','profit_factor','fees_paid_tmn')}}))" "$m" "$id" "$(echo $REST | sed -E 's/.*--days ([0-9.]+).*/\1/')"
            done
          else
            /root/.local/bin/uv run python -m wallex_agent.engine backtest $ARGS
            for d in $(ls -td ../data/backtests/*/ | head -2); do echo "== $d"; head -45 "$d/report.md"; done
          fi
