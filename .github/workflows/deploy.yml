# Continuous deployment to the challenge VPS.
# GitHub-hosted runners can't SSH in (the VPS is in Iran and port 22 is filtered from abroad), so the deploy
# job runs on a self-hosted runner on the VPS itself, which only needs outbound HTTPS to GitHub.
# One-time setup on the VPS: deploy/setup-runner.sh
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # on the VPS too: it reaches the live Wallex API (GitHub's US runners time out on it); the frontend
  # type-check and build run inside deploy.sh, which aborts before touching the app if they fail
  test:
    runs-on: [self-hosted, wallex-vps]
    steps:
      - uses: actions/checkout@v4
      - name: Backend tests
        working-directory: backend
        run: /root/.local/bin/uv sync --frozen && /root/.local/bin/uv run pytest -q

  deploy:
    needs: test
    runs-on: [self-hosted, wallex-vps]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to /opt/wallex-agent
        run: bash deploy/deploy.sh "$GITHUB_WORKSPACE" "${GITHUB_SHA::7}"
